baseURL: https://pg36g.vonng.com/
locale: zh-CN
title: PostgreSQL 36 计

enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true

services:
  googleAnalytics:
    ID: G-MY3FSJ7R6E

outputs:
  home: [HTML, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1

contentDir: docs

defaultContentLanguage: zh
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: PostgreSQL 36 计

markup:
  goldmark:
    extensions:
      footnote: true         # 开启脚注语法：[^id] / [^id]: text
      linkify: true          # 自动将 URL 文本转为链接
      table: true            # 启用 Markdown 表格
      taskList: true         # 启用任务列表 [ ] / [x]
      typographer: true      # 智能排版（引号、破折号等）
    parser:
      attribute: true        # 允许在标题后写 {#id .class key=val}，用于显式锚点
      autoHeadingID: true    # 为标题自动生成 ID（手写 {#id} 会覆盖自动生成）
      autoHeadingIDType: github  # 自动 ID 规则：github / blackfriday / none
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2            # ToC 从 h2 开始
    endLevel: 4              # ToC 到 h4 结束

menus:
  main:
    - identifier: guide
      name: 开始阅读
      pageRef: /guide
      weight: 10
      params:
        icon: fa-solid fa-book-open
    - identifier: guide-lab
      parent: guide
      name: 准备实验环境
      pageRef: /ch00
      weight: 10
      params:
        icon: fa-solid fa-flask
        description: 从可销毁的 Pigsty 沙箱开始
    - identifier: guide-toc
      parent: guide
      name: 完整目录
      pageRef: /toc
      weight: 20
      params:
        icon: fa-solid fa-list-ol
        description: 36 章、独立节页与稳定锚点
    - identifier: toc
      name: 全书结构
      pageRef: /toc
      weight: 20
      params:
        icon: fa-solid fa-layer-group
    - identifier: toc-upper
      parent: toc
      name: 上卷：应用开发
      pageRef: /upper-volume
      weight: 10
      params:
        icon: fa-solid fa-code
        description: 从工程认知到稳定交付与能力扩展
    - identifier: toc-lower
      parent: toc
      name: 下卷：运维管理
      pageRef: /lower-volume
      weight: 20
      params:
        icon: fa-solid fa-server
        description: 从生产规划到运营、恢复与复盘
    - identifier: indexes
      name: 索引中心
      pageRef: /indexes
      weight: 30
      params:
        icon: fa-solid fa-compass
    - identifier: indexes-roles
      parent: indexes
      name: 按角色阅读
      pageRef: /indexes/roles
      weight: 10
      params:
        icon: fa-solid fa-users
        description: 开发、DBA、平台与事故响应路线
    - identifier: indexes-tasks
      parent: indexes
      name: 按任务查找
      pageRef: /indexes/tasks
      weight: 20
      params:
        icon: fa-solid fa-list-check
        description: 从实际工程任务进入相关章节
    - identifier: indexes-incidents
      parent: indexes
      name: 事故症状与安全动作
      pageRef: /indexes/incidents
      weight: 30
      params:
        icon: fa-solid fa-triangle-exclamation
        description: 先判定首个安全动作，再进入正式章节
    - identifier: indexes-capabilities
      parent: indexes
      name: 技术边界索引
      pageRef: /indexes/capabilities
      weight: 40
      params:
        icon: fa-solid fa-diagram-project
        description: PostgreSQL、平台与 Pigsty 的责任边界
    - identifier: appendices
      name: 附录
      pageRef: /appendices
      weight: 40
      params:
        icon: fa-solid fa-bookmark
    - identifier: github
      name: GitHub
      url: https://github.com/Vonng/pg36g
      weight: 90
      params:
        icon: fa-brands fa-github

params:
  description: 从 SQL 到生产：PostgreSQL 与 Pigsty 实战
  time_format_default: 2006年1月2日
  logo: logo.png
  github_repo: https://github.com/Vonng/pg36g
  github_project_repo: https://github.com/Vonng/pg36g
  github_branch: main
  page_width: wide
  highlight_classes: true
  offlineSearch: true
  offlineSearchIndex: summary
  offlineSearchSummaryLength: 90
  offlineSearchMaxResults: 12
  copyright:
    authors: '[冯若航（Vonng）](https://vonng.com)'
    from_year: 2025
    to_year: present
  comments:
    enable: true
    type: giscus
    giscus:
      repo: Vonng/pg36g
      repoId: R_kgDOPbyKAw
      category: Announcements
      categoryId: DIC_kwDOPbyKA84CuCWv
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      theme: auto
      loading: lazy
  ui:
    quick_links: [guide, toc, indexes]
    sidebar_icon_policy: groups
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_root_enabled: true
    sidebar_root_menu: false
    sidebar_width_min: 280
    sidebar_width_max: 520
    sidebar_item_overflow: wrap
    showLightDarkModeMenu: true
    typography:
      preset: system
    image_zoom:
      enable: true
    page_context_menu:
      enable: true
      assistant_links: true
    feedback:
      enable: false
    ul_show: 1
    scrollSpy:
      disable: false
    command_palette:
      commands:
        - id: book_toc
          title: 打开完整目录
          description: 浏览 36 章、节页与稳定锚点
          url: /toc/
          icon: fa-solid fa-list-ol
          keywords: [目录, 章节, toc]
        - id: incident_guide
          title: 查找事故首个安全动作
          description: 按症状进入恢复、切换或取证章节
          url: /indexes/incidents/
          icon: fa-solid fa-triangle-exclamation
          keywords: [事故, 应急, 恢复, 故障]
        - id: lab_contract
          title: 查看实验环境合同
          description: 确认版本、拓扑、风险与停止条件
          url: /appendices/e/
          icon: fa-solid fa-flask-vial
          keywords: [实验, 沙箱, 安全, 版本]
