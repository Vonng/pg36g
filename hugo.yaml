baseURL: https://pg36g.vonng.com/
locale: zh-CN
title: PG 三十六计

enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true

services:
  googleAnalytics:
    ID: G-MY3FSJ7R6E

outputs:
  home: [HTML, print, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1

contentDir: docs

defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: PG 三十六计
    params:
      description: 从 SQL 到生产：PostgreSQL 与 Pigsty 实战
      time_format_default: 2006年1月2日
      ui:
        command_palette:
          commands:
            - id: book_toc
              title: 打开完整目录
              description: 浏览 36 章、节页与稳定锚点
              url: /toc/
              icon: fa-solid fa-list-ol
              keywords: [目录, 章节, toc]
            - id: incident_guide
              title: 查找事故首个安全动作
              description: 按症状进入恢复、切换或取证章节
              url: /indexes/incidents/
              icon: fa-solid fa-triangle-exclamation
              keywords: [事故, 应急, 恢复, 故障]
            - id: lab_contract
              title: 查看实验环境合同
              description: 确认版本、拓扑、风险与停止条件
              url: /appendices/e/
              icon: fa-solid fa-flask-vial
              keywords: [实验, 沙箱, 安全, 版本]
  en:
    label: English guide
    locale: en-US
    weight: 2
    title: PostgreSQL 36 Stratagems
    params:
      description: A production field guide to PostgreSQL and Pigsty; the full manuscript is in Chinese.
      time_format_default: Jan 2, 2006
      ui:
        command_palette:
          commands:
            - id: book_toc
              title: Open the complete contents
              description: Browse all 36 chapters and their stable anchors
              # Keep the English overview open while handing readers to the
              # Chinese manuscript. The explicit default port prevents Hugo's
              # relLangURL from rewriting this canonical route under /en/.
              url: https://pg36g.vonng.com:443/toc/
              icon: fa-solid fa-list-ol
              keywords: [contents, chapters, toc]
            - id: incident_guide
              title: Find the first safe incident action
              description: Route a symptom to recovery, failover, or forensics
              url: https://pg36g.vonng.com:443/indexes/incidents/
              icon: fa-solid fa-triangle-exclamation
              keywords: [incident, emergency, recovery, failure]
            - id: lab_contract
              title: Read the lab environment contract
              description: Confirm versions, topology, risk, and stop conditions
              url: https://pg36g.vonng.com:443/appendices/e/
              icon: fa-solid fa-flask-vial
              keywords: [lab, sandbox, safety, version]

markup:
  goldmark:
    renderer:
      unsafe: true          # OINK 的百分号容器 shortcode 会生成内联 HTML
    extensions:
      footnote: true         # 开启脚注语法：[^id] / [^id]: text
      linkify: true          # 自动将 URL 文本转为链接
      table: true            # 启用 Markdown 表格
      taskList: true         # 启用任务列表 [ ] / [x]
      typographer: true      # 智能排版（引号、破折号等）
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    parser:
      wrapStandAloneImageWithinParagraph: false # OINK 原生图片块需要直接附加属性
      attribute:
        block: true          # OINK 原生组件与编号对象需要块属性
        title: true          # 允许在标题后写 {#id .class key=val}
      autoHeadingID: true    # 为标题自动生成 ID（手写 {#id} 会覆盖自动生成）
      autoHeadingIDType: github  # 自动 ID 规则：github / blackfriday / none
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2            # ToC 从 h2 开始
    endLevel: 4              # ToC 到 h4 结束

params:
  description: 从 SQL 到生产：PostgreSQL 与 Pigsty 实战
  time_format_default: 2006年1月2日
  logo: logo.png
  github_repo: https://github.com/Vonng/pg36g
  github_project_repo: https://github.com/Vonng/pg36g
  github_branch: main
  page_width: wide
  reading_width: normal
  highlight_classes: true
  offline_search: true
  offline_search_index: summary
  offline_search_summary_length: 90
  offline_search_max_results: 12
  copyright:
    authors: '[冯若航（Vonng）](https://vonng.com)'
    from_year: 2025
    to_year: present
  comments:
    enable: true
    type: giscus
    giscus:
      repo: Vonng/pg36g
      repoId: R_kgDOPbyKAw
      category: Announcements
      categoryId: DIC_kwDOPbyKA84CuCWv
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      theme: auto
      loading: lazy
  ui:
    shell_types: [book]
    quick_links: [contents, indexes]
    navbar_enabled: true
    landing_search: true
    footer_style: fat
    sidebar_icon_policy: groups
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_root_enabled: true
    sidebar_root_menu: false
    # OINK's Book resolver normally scopes nested books to FirstSection. This
    # book keeps all 36 chapter sections at the site root, so the project shim
    # in layouts/_partials/shell/sidebar-root.html preserves the home tree.
    book_sidebar_root: home
    sidebar_width_min: 360
    sidebar_width_max: 420
    sidebar_item_overflow: ellipsis
    sidebar_headings: false
    book_draft_banner: false
    pager_types: [book]
    keyboard_nav: true
    dark_mode: true
    image_zoom: true
    page_context_menu:
      enable: true
      assistant_links: true
    feedback:
      enable: false
    sidebar_expand_levels: 1
    scroll_spy: true
