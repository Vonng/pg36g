purpose:
  class: pg36-purpose
  eyebrow: 这本书解决什么问题
  title: 把数据库知识变成可验收的工程能力
  body: |
    > PostgreSQL 是核心知识对象；Pigsty 是统一实验载体、观察窗口与生产参考实现。

    本书不按命令、参数或产品功能堆砌知识点。上卷从对象、模型、查询、并发与发布出发，回答“怎样写对并稳定交付”；下卷从部署、HA、备份、可观测与容量出发，回答“怎样持续运行并在故障中保住选择”。

    每一章最终都要交付一种可以复现、审查或演练的能力。平台实现会回到 PostgreSQL 原生 SQL、系统目录、日志或组件证据复核；示例输出不会被当成脱离版本和拓扑的普遍结论。

parts:
  class: pg36-parts
  eyebrow: 六篇正文
  title: 从工程认知，到恢复与改进
  desc: 三篇应用开发、三篇运维管理；每篇六章，共同组成一条完整的生产路径。
