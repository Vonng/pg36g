evidence:
  class: pg36-evidence
  eyebrow: 实验契约
  title: 命令跑通，只说明命令跑通
  body: |
    每个实验都沿着同一条证据链组织：

    1. **目标与前提**：先写清版本、拓扑、凭据、数据状态与完成标准。
    2. **风险与停止线**：用 R0–R3 标出观察、可回退变更、故障注入与破坏性动作。
    3. **动作与证据**：同时保存 SQL、配置、日志、计划、时间线或监控事实，不用单一面板替代判断。
    4. **验收与复位**：证明结果、记录不能外推的边界，并把环境恢复到下一章可以继续使用的状态。

    正文以 PostgreSQL 18.6 与 Pigsty v4.5.0 为当前复现基线；涉及其他版本时，会就地标明差异，而不是让读者猜测。

