      url: postgresql-pigsty-map/
    - title: 应用
      meta: 02 · ch07–ch12
      icon: fa-solid fa-code
      desc: 用计划、统计、索引、并发控制与变更规约把 SQL 变成稳定服务。
      url: query-plans-statistics/
    - title: 扩展
      meta: 03 · ch13–ch18
      icon: fa-solid fa-puzzle-piece
      desc: 判断存储过程、扩展、检索、时空与分析能力应该用到哪里、止于哪里。
      url: functions-triggers-procedures/
    - title: 规划
      meta: 04 · ch19–ch24
      icon: fa-solid fa-server
      desc: 从 SLO、故障域与恢复目标反推部署、HA、备份、接入和权限设计。
      url: deployment-baseline/
    - title: 运营
      meta: 05 · ch25–ch30
      icon: fa-solid fa-chart-line
      desc: 用可观测性、容量基线、资源治理、维护、迁移和升级持续运营。
      url: observability/
    - title: 出山
      meta: 06 · ch31–ch36
      icon: fa-solid fa-shield-halved
      desc: 从现场保护进入 PITR、切换、过载处置、数据取证与复盘固化。
      url: incident-response/

