    - id: item-34-7-2
      number: 34.7.2
      title: 用连接池、代理与应用控制点逐级减压
    - id: item-34-7-3
      number: 34.7.3
      title: 从面板判断范围，再用 SQL 与主机证据判型
  - id: ch34-s08
    number: '34.8'
    index: 8
    slug: '08'
    capability: 平台
    title: 实战：同一症状、两种成因
    items:
    - id: item-34-8-1
      number: 34.8.1
      title: 随机注入连接风暴或 WAL 保留
    - id: item-34-8-2
      number: 34.8.2
      title: 在不知道答案时先判型，再选择动作
    - id: item-34-8-3
      number: 34.8.3
      title: 对流量型恢复服务，对保留型完成安全路由
    - id: item-34-8-4
      number: 34.8.4
      title: 输出动作时间线、误判代价与容量改进项
