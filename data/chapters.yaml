- id: ch34
  number: 34
  title: 过载保护与资源故障判型——李代桃僵
  idiom: 李代桃僵
  functional_title: 过载保护与资源故障判型
  slug: overload-resource-incidents
  goal: 从资源症状进入，第一步区分流量型与保留型；只对流量型执行限流、取消、摘流和降级，对保留型实施安全保护并路由到正确章节。
  sections:
  - id: ch34-s01
    number: '34.1'
    index: 1
    slug: '01'
    capability: 平台
    title: 第一动作：流量型还是保留型
    items:
    - id: item-34-1-1
      number: 34.1.1
      title: 流量增长、慢查询、锁与连接导致的竞争
    - id: item-34-1-2
      number: 34.1.2
      title: WAL、XID、复制槽、归档和长事务导致的保留
    - id: item-34-1-3
      number: 34.1.3
      title: 同样表现为“磁盘满”或“延迟高”，动作可以相反
    - id: item-34-1-4
      number: 34.1.4
      title: 判型不清时先停止破坏性清理
  - id: ch34-s02
    number: '34.2'
    index: 2
    slug: '02'
    capability: 平台
    title: 连接风暴与排队失控
    items:
    - id: item-34-2-1
      number: 34.2.1
      title: 数据库连接、代理池与应用池三层
    - id: item-34-2-2
      number: 34.2.2
      title: 重试放大、健康检查和短连接
    - id: item-34-2-3
      number: 34.2.3
      title: 限流、队列、连接预算与指数退避
  - id: ch34-s03
    number: '34.3'
    index: 3
    slug: '03'
    capability: PG
    title: 失控查询、锁与事务
    items:
    - id: item-34-3-1
      number: 34.3.1
      title: 识别高消耗查询和阻塞根节点
    - id: item-34-3-2
      number: 34.3.2
      title: cancel、terminate 与中止后成本
    - id: item-34-3-3
      number: 34.3.3
      title: 长事务和大事务结束前先评估后果
  - id: ch34-s04
    number: '34.4'
    index: 4
    slug: '04'
    capability: 平台
    title: CPU、内存、I/O 与 OOM
    items:
    - id: item-34-4-1
      number: 34.4.1
      title: 饱和、排队、抖动与抢占
    - id: item-34-4-2
      number: 34.4.2
      title: 临时文件、并行、checkpoint 与后台维护
    - id: item-34-4-3
      number: 34.4.3
      title: 内存最坏并发、OOM killer 与进程重启
  - id: ch34-s05
    number: '34.5'
    index: 5
    slug: '05'
    capability: 平台
    title: 流量型止血动作
    items:
    - id: item-34-5-1
      number: 34.5.1
      title: 限流、熔断、摘除非关键负载
    - id: item-34-5-2
      number: 34.5.2
      title: 取消查询、暂停批处理与只读降级
    - id: item-34-5-3
      number: 34.5.3
      title: 每个动作写清收益、代价、停止条件和回退
  - id: ch34-s06
    number: '34.6'
    index: 6
    slug: '06'
    capability: PG
    title: 保留型故障的安全路由
    items:
    - id: item-34-6-1
      number: 34.6.1
      title: XID：检查 `backend_xmin`、复制槽 `xmin` 与 `pg_prepared_xacts`
    - id: item-34-6-2
      number: 34.6.2
      title: WAL 撑盘：检查归档失败、复制槽和未完成备份
    - id: item-34-6-3
      number: 34.6.3
      title: 绝不手工删除 `pg_wal`；保护现场后转 ch21/ch28/ch35
    - id: item-34-6-4
      number: 34.6.4
